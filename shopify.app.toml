# }
# """

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_discounts,unauthenticated_read_product_listings,read_content,read_legal_policies,read_online_store_pages,read_metaobjects,read_inventory"

[auth]
redirect_urls = [
  "https://struggle-throwing-recycled.ngrok-free.dev/auth/callback",
  "https://struggle-throwing-recycled.ngrok-free.dev/api/auth"
]

[pos]
embedded = false

[customer_authentication]
redirect_uris = [
  "https://struggle-throwing-recycled.ngrok-free.dev/callback"
]
