# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "60103ebc43235135f4eabaeaffd72669"
name = "manishclothes-chatbot"
handle = "pureflowair-chatbot"
application_url = "https://struggle-throwing-recycled.ngrok-free.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true


[webhooks]
api_version = "2026-10"

[events]
api_version = "2026-10"

[[events.subscription]]
handle = "article-event"
topic = "Article"
actions = ["create", "update", "delete"]
triggers = ["article.*"]
uri = "https://struggle-throwing-recycled.ngrok-free.dev/events"
query = """
query article_details($articleId: ID!) {
  article(id: $articleId) { id title handle }
}
"""

