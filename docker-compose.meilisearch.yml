# Meilisearch for search_product.
#   npm run meili:up     start (data persists in the meili_data volume)
#   npm run meili:down   stop
# MEILI_MASTER_KEY is read from .env.
services:
  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    container_name: perfumania-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data

volumes:
  meili_data:
